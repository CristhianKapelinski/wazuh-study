services:
  wazuh.manager:
    environment:
      INDEXER_PASSWORD: ${ADMIN_PASSWORD}
      API_PASSWORD: ${API_PASSWORD}
    # no ports: there are no agents (ingestion via feed.log); the dashboard talks over the internal network
    ports: !override []
    volumes: !override
      - ${DATA_DIR}/manager/api-config:/var/ossec/api/configuration
      - ${DATA_DIR}/manager/etc:/var/ossec/etc
      - ${DATA_DIR}/manager/logs:/var/ossec/logs
      - ${DATA_DIR}/manager/queue:/var/ossec/queue
      - ${DATA_DIR}/manager/var-multigroups:/var/ossec/var/multigroups
      - ${DATA_DIR}/manager/integrations:/var/ossec/integrations
      - ${DATA_DIR}/manager/active-response:/var/ossec/active-response/bin
      - ${DATA_DIR}/manager/agentless:/var/ossec/agentless
      - ${DATA_DIR}/manager/wodles:/var/ossec/wodles
      - ${DATA_DIR}/manager/filebeat-etc:/etc/filebeat
      - ${DATA_DIR}/manager/filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ../manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      # versioned custom rules (rw bind mount); the UI creates/edits here and it persists
      - ../rules:/var/ossec/etc/rules
      # dataset (read-only source); run.sh injects it into feed.log
      - ../dataset/sample-1000.log:/var/ossec/logs/study/sample-1000.log:ro

  wazuh.indexer:
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ports: !override []
    volumes: !override
      - ${DATA_DIR}/indexer/data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    environment:
      INDEXER_PASSWORD: ${ADMIN_PASSWORD}
      DASHBOARD_PASSWORD: ${KIBANASERVER_PASSWORD}
      API_PASSWORD: ${API_PASSWORD}
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT}:5601"
    volumes: !override
      - ${DATA_DIR}/dashboard/config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ${DATA_DIR}/dashboard/custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
